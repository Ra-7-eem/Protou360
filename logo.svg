<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 54" fill="none" width="230" height="54">
  <defs>
    <!-- Gold metallic gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed8a1"/>
      <stop offset="40%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9a752e"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#11422c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#11422c" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#c5a059" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 360 Compass & Aperture Emblem (Right side) -->
  <g transform="translate(196, 27)" filter="url(#goldDrop)">
    <!-- Lens Glow Background -->
    <circle r="23" fill="url(#lensGlow)"/>

    <!-- Outer 360 Orbital Ring with Directional Arrow -->
    <circle r="22" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="115 15" stroke-linecap="round"/>
    
    <!-- Outer Orbit Arrow Head -->
    <polygon points="12.5,-18 16,-22.5 19,-17" fill="url(#goldGrad)"/>

    <!-- Inner Golden Frame Ring -->
    <circle r="17" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Camera Shutter / Aperture Blades (8 Blades) -->
    <g stroke="url(#goldGrad)" stroke-width="1.3" stroke-linecap="round" fill="none">
      <path d="M0 -17 L7 -6" />
      <path d="M12 -12 L6 7" />
      <path d="M17 0 L-6 7" />
      <path d="M12 12 L-7 6" />
      <path d="M0 17 L-7 -6" />
      <path d="M-12 12 L-6 -7" />
      <path d="M-17 0 L6 -7" />
      <path d="M-12 -12 L7 -6" />
    </g>

    <!-- Center Camera Core -->
    <circle r="6" fill="#11422c" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle r="2.2" fill="url(#goldGrad)"/>

    <!-- 4 Cardinal Compass Points -->
    <circle cx="0" cy="-22" r="1.3" fill="#11422c"/>
    <circle cx="22" cy="0" r="1.3" fill="#11422c"/>
    <circle cx="0" cy="22" r="1.3" fill="#11422c"/>
    <circle cx="-22" cy="0" r="1.3" fill="#11422c"/>
  </g>

  <!-- Brand Typography: Perfectly balanced natural spacing -->
  <g id="brandTypography">
    <!-- Arabic Brand Name: بروتو -->
    <text x="143" y="29" text-anchor="middle" font-family="'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22.5" fill="#11422c">
      بروتو
    </text>

    <!-- 360 with Degree Symbol firmly attached right next to بروتو -->
    <g transform="translate(84, 29)">
      <text x="0" y="0" text-anchor="middle" font-family="'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="23.5" fill="url(#goldGrad)" letter-spacing="0.5">
        360
      </text>
      <!-- Degree symbol circle locked directly to top-right of 360 -->
      <circle cx="25" cy="-14" r="2.7" stroke="url(#goldGrad)" stroke-width="1.6" fill="none"/>
    </g>

    <!-- Subtitle: English Brand (Refined balanced margin, aligned with top text) -->
    <text x="103" y="44" text-anchor="middle" font-family="'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.8" fill="#c5a059" letter-spacing="0.6" textLength="122" lengthAdjust="spacing">
      360 - VIRTUAL EXPERIENCES
    </text>
  </g>
</svg>
